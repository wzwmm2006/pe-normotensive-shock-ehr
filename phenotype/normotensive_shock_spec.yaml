name: strict_normotensive_shock
version: 1.0.1
guideline: "2026 AHA/ACC acute pulmonary embolism guideline"
analysis_window:
  start_hours_from_index: 0
  end_hours_from_index: 24

marker_states:
  allowed: [TRUE, FALSE, UNKNOWN]
  TRUE: "Criterion is evaluable and meets its positive threshold."
  FALSE: "Criterion is evaluable and does not meet its positive threshold."
  UNKNOWN: "Criterion is not evaluable from the available structured data."

strict_domains:
  lactate:
    unit: "mmol/L"
    evaluability: "At least one valid numeric value in the 0-24-hour window."
    positive_operator: ">"
    positive_threshold: 2.0
    aggregation: "maximum in-window value"
  creatinine_delta:
    unit: "mg/dL"
    source_text_note: "The published guideline prints mg/mL; this implementation retains 0.3 and uses the conventional mg/dL unit supported by the SCAI shock definition."
    evaluability: "At least two valid values at distinct times in the 0-24-hour window."
    positive_operator: ">="
    positive_threshold: 0.3
    interval_hours: 24
    aggregation: "maximum later value minus first in-window value"
  urine_output:
    unit: "mL/24 h"
    evaluability: "Valid nonnegative events and complete 24-hour structured observation."
    positive_operator: "<"
    positive_threshold: 720
    interval_hours: 24
    aggregation: "sum over complete window"
  cardiac_index:
    unit: "L/min/m2"
    guideline_measurement: "Derived from peripheral arterial and mixed venous oxygen saturation values."
    evaluability: "A valid guideline-specified oxygen-saturation-derived value in the 0-24-hour window."
    source_mapping_status: "Not faithfully computable from the available structured source; MIMIC itemid 228368 is NICOM and is excluded."
    positive_operator: "<="
    positive_threshold: 2.2
    aggregation: "minimum in-window value when a faithful source mapping is available"

phenotype_logic:
  positive: "any strict-domain state is TRUE"
  negative: "all four strict-domain states are FALSE"
  indeterminate: "no strict-domain state is TRUE and at least one is UNKNOWN"

implementation_scenarios:
  missing_as_false:
    mapping: "UNKNOWN -> FALSE"
    note: "Deterministic simulated implementation scenario; not attributed to a specific deployed system."
  complete_case:
    rule: "Classify only when all four states are observed."
  uncertainty_aware:
    rule: "Preserve TRUE, FALSE, and UNKNOWN and apply phenotype_logic."

excluded_from_strict_phenotype:
  - mean arterial pressure
  - Glasgow Coma Scale
  - vasopressor use
  - ventilation
  - downstream clinical outcomes
